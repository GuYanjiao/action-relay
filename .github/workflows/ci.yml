name: Validate

on:
  push:
    branches: [main, 'work/**']
  pull_request:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: watch/package-lock.json
      - run: npm ci
      - run: npm test
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: '.java-version'
      - name: Run protocol, lifecycle and transport regression
        shell: pwsh
        run: ./scripts/test.ps1 -Area protocol
