name: Capture Manual Screenshots (v0.4.9)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to capture (e.g. v0.4.9)"
        required: true
        default: "v0.4.9"
      theme:
        description: "Android UI theme (light or dark)"
        required: true
        default: "light"
        type: choice
        options:
          - light
          - dark

permissions:
  contents: read

jobs:
  android-screenshots:
    name: Capture Android APK Screenshots (Ubuntu KVM Emulator)
    runs-on: ubuntu-22.04
    steps:
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p screenshots
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "ActionRelay-*.apk" \
            --dir .
          ls -lh ActionRelay-*.apk

      - name: Boot x86_64 Google APIs Emulator (with ARM64 translation) and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            APK_FILE=$(ls ActionRelay-*.apk | head -n 1)
            adb install -r "$APK_FILE"

            if [ "${{ inputs.theme }}" = "dark" ]; then
              adb shell cmd uimode night yes
            else
              adb shell cmd uimode night no
            fi

            # Grant runtime permissions so UI screens render cleanly without blocking dialogs
            adb shell pm grant cn.local.actionrelay android.permission.BLUETOOTH_SCAN || true
            adb shell pm grant cn.local.actionrelay android.permission.BLUETOOTH_CONNECT || true
            adb shell pm grant cn.local.actionrelay android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant cn.local.actionrelay android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant cn.local.actionrelay android.permission.ACCESS_COARSE_LOCATION || true

            adb shell am start -n cn.local.actionrelay/.MainActivity
            sleep 5

            python3 - << 'PYEOF'
            import re, subprocess, time, xml.etree.ElementTree as ET

            def adb(*args):
                return subprocess.check_output(["adb", *args])

            def snap(name):
                time.sleep(1.5)
                data = adb("exec-out", "screencap", "-p")
                with open(f"screenshots/{name}", "wb") as f:
                    f.write(data)
                print(f"Captured screenshots/{name} ({len(data)} bytes)")

            def tap_text(target_text):
                xml_bytes = adb("exec-out", "uiautomator", "dump", "/dev/tty")
                xml_str = xml_bytes.decode("utf-8", errors="ignore")
                start = xml_str.find("<?xml")
                end = xml_str.rfind("</hierarchy>")
                if start == -1 or end == -1:
                    raise RuntimeError(f"Failed to dump UI hierarchy when looking for {target_text}")
                root = ET.fromstring(xml_str[start:end + len("</hierarchy>")])
                for node in root.iter("node"):
                    txt = node.attrib.get("text", "")
                    desc = node.attrib.get("content-desc", "")
                    if txt == target_text or desc == target_text:
                        bounds = node.attrib.get("bounds", "")
                        m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
                        if m:
                            x = (int(m.group(1)) + int(m.group(3))) // 2
                            y = (int(m.group(2)) + int(m.group(4))) // 2
                            adb("shell", "input", "tap", str(x), str(y))
                            time.sleep(1.5)
                            return True
                print(f"Warning: element '{target_text}' not found")
                return False

            def go_back():
                adb("shell", "input", "keyevent", "4")
                time.sleep(1.5)

            # 1. Home page
            snap("01_phone_home.png")

            # 2. Camera page
            if tap_text("相机"):
                snap("02_phone_camera.png")
                go_back()

            # 3. GPS page
            if tap_text("GPS"):
                snap("03_phone_gps.png")
                go_back()

            # 4. Tools page -> Updates & Logs
            if tap_text("工具"):
                snap("04_phone_tools.png")
                if tap_text("检查更新"):
                    time.sleep(3)
                    snap("05_phone_updates.png")
                    go_back()
                if tap_text("连接记录"):
                    snap("06_phone_logs.png")
                    go_back()
            PYEOF

      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-${{ inputs.release_tag }}-${{ inputs.theme }}
          path: screenshots/*.png

  watch-screenshots:
    name: Render Watch S4 UI Previews (from watch/src/pages/index/index.ux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node & Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Render 466x466 Watch UI pages using real icons and CSS
        run: |
          mkdir -p watch_screenshots
          node - << 'JSEOF'
          const fs = require("fs");
          const path = require("path");
          const { chromium } = require("playwright");

          const uiDir = path.resolve("watch/src/common/ui");
          function imgData(file) {
            const p = path.join(uiDir, file);
            if (!fs.existsSync(p)) return "";
            return "data:image/png;base64," + fs.readFileSync(p).toString("base64");
          }

          const baseCss = `
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans CJK SC", "PingFang SC", sans-serif; }
            body { width: 466px; height: 466px; background: #000000; overflow: hidden; }
            .dial { width: 466px; height: 466px; border-radius: 50%; background: #000000; position: relative; overflow: hidden; border: 2px solid #1e242d; }
            .status-item { position: absolute; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; }
            .status-phone { left: 74px; top: 87px; }
            .status-camera { left: 157px; top: 36px; }
            .status-gps { left: 253px; top: 36px; }
            .status-battery { left: 336px; top: 87px; }
            .status-icon { width: 44px; height: 44px; }
            .storage-badge { position: absolute; left: 14px; top: 211px; width: 104px; height: 69px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
            .temperature-badge { position: absolute; left: 348px; top: 211px; width: 104px; height: 69px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
            .storage-value { width: 104px; text-align: center; font-size: 17px; color: #f1f3f6; margin-top: 2px; }
            .temperature-value { width: 104px; text-align: center; font-size: 19px; color: #f1f3f6; margin-top: 2px; }
            .capture { position: absolute; left: 121px; top: 121px; width: 224px; height: 224px; display: flex; align-items: center; justify-content: center; }
            .capture-image { width: 192px; height: 192px; }
            .timer { position: absolute; left: 145px; top: 354px; width: 176px; height: 44px; text-align: center; font-size: 36px; color: #f1f3f6; line-height: 44px; }
            .format-summary { position: absolute; left: 153px; top: 398px; width: 160px; height: 44px; text-align: center; font-size: 24px; color: #cbd3df; line-height: 44px; }
            .mode-settings { width: 466px; height: 466px; display: flex; flex-direction: column; align-items: center; padding-top: 42px; }
            .mode-title { font-size: 28px; color: #f1f3f6; height: 42px; }
            .mode-state { font-size: 20px; color: #a6b0bf; height: 38px; }
            .mode-choice { width: 280px; height: 68px; border-radius: 24px; background: #202630; display: flex; align-items: center; justify-content: center; margin-top: 12px; color: #e9edf4; font-size: 28px; }
            .mode-note { margin-top: 14px; font-size: 18px; color: #a6b0bf; }
            .mode-back { width: 180px; height: 58px; border-radius: 24px; background: #171b22; display: flex; align-items: center; justify-content: center; margin-top: 14px; color: #b9c5d5; font-size: 21px; }
            .tools { width: 466px; height: 466px; display: flex; flex-direction: column; align-items: center; padding-top: 38px; }
            .tools-title { font-size: 27px; color: #f1f3f6; height: 46px; }
            .tools-row { width: 290px; height: 48px; display: flex; align-items: center; }
            .row-icon { width: 27px; height: 27px; margin-right: 13px; }
            .feedback-mark { width: 27px; height: 27px; margin-right: 13px; text-align: center; font-size: 19px; color: #6ad9a4; line-height: 27px; }
            .row-text { font-size: 20px; color: #cbd3df; }
            .tools-note { width: 292px; height: 60px; font-size: 18px; color: #a6b0bf; margin-top: 8px; }
            .refresh-button { width: 280px; height: 64px; border-radius: 24px; background: #202630; display: flex; align-items: center; justify-content: center; margin-top: 8px; color: #e9edf4; font-size: 22px; }
            .back-button { width: 202px; height: 62px; border-radius: 25px; background: #171b22; display: flex; align-items: center; justify-content: center; margin-top: 12px; color: #b9c5d5; font-size: 21px; }
          `;

          const pages = [
            {
              file: "07_watch_home.png",
              body: `<div class="dial">
                <div class="status-item status-phone"><img class="status-icon" src="${imgData("phone-on.png")}"/></div>
                <div class="status-item status-camera"><img class="status-icon" src="${imgData("camera-on.png")}"/></div>
                <div class="status-item status-gps"><img class="status-icon" src="${imgData("gps-on.png")}"/></div>
                <div class="status-item status-battery"><img class="status-icon" src="${imgData("battery-high.png")}"/></div>
                <div class="storage-badge"><img class="status-icon" src="${imgData("sd-card.png")}"/><div class="storage-value">1小时02分</div></div>
                <div class="temperature-badge"><img class="status-icon" src="${imgData("temperature-normal.png")}"/><div class="temperature-value">正常</div></div>
                <div class="capture"><img class="capture-image" src="${imgData("capture-record.png")}"/></div>
                <div class="timer">00:00</div>
                <div class="format-summary">4K · 60</div>
              </div>`
            },
            {
              file: "08_watch_mode.png",
              body: `<div class="dial"><div class="mode-settings">
                <div class="mode-title">拍摄模式</div>
                <div class="mode-state">当前：视频</div>
                <div class="mode-choice">视频</div>
                <div class="mode-choice">拍照</div>
                <div class="mode-note">分辨率和帧率在相机设置</div>
                <div class="mode-back">返回</div>
              </div></div>`
            },
            {
              file: "09_watch_tools.png",
              body: `<div class="dial"><div class="tools">
                <div class="tools-title">连接</div>
                <div class="tools-row"><img class="row-icon" src="${imgData("phone-on.png")}"/><div class="row-text">手机：已连接</div></div>
                <div class="tools-row"><img class="row-icon" src="${imgData("camera-on.png")}"/><div class="row-text">相机：已连接</div></div>
                <div class="tools-row"><div class="feedback-mark">振</div><div class="row-text">录制反馈：开启</div></div>
                <div class="tools-note">状态以相机回报为准</div>
                <div class="refresh-button"><img class="row-icon" src="${imgData("refresh.png")}"/>刷新状态</div>
                <div class="back-button"><img class="row-icon" src="${imgData("back.png")}"/>返回</div>
              </div></div>`
            }
          ];

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 466, height: 466 } });
            for (const item of pages) {
              await page.setContent(`<!doctype html><html><head><meta charset="utf-8"><style>${baseCss}</style></head><body>${item.body}</body></html>`);
              await page.screenshot({ path: `watch_screenshots/${item.file}` });
              console.log("Rendered", item.file);
            }
            await browser.close();
          })();
          JSEOF

      - name: Upload Watch UI previews
        uses: actions/upload-artifact@v4
        with:
          name: watch-ui-previews-${{ inputs.release_tag }}
          path: watch_screenshots/*.png
