name: Rust core and ARM64
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: '.java-version'
          cache: gradle
      - name: Install pinned stable Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup target add --toolchain 1.99.1 aarch64-linux-android
      - name: Rust tests and lint
        run: |
          cargo test --manifest-path rust-core/Cargo.toml --locked
          cargo clippy --manifest-path rust-core/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build host JNI and run original protocol/lifecycle/queue regressions
        shell: pwsh
        run: |
          bash scripts/build-rust.sh host
          if ($LASTEXITCODE) { throw 'Host native build failed.' }
          $env:JAVA_TOOL_OPTIONS="--enable-native-access=ALL-UNNAMED -Djava.library.path=$env:GITHUB_WORKSPACE/android/native-libs/host"
          ./scripts/test.ps1 -Area protocol
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: 'ndk;30.0.16248370'
      - name: Build optimized Android ARM64 library
        run: bash scripts/build-rust.sh android
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-arm64-${{ github.sha }}
          path: android/native-libs/arm64-v8a/*
          if-no-files-found: error
