name: Build packages

on:
  workflow_dispatch:
  push:
    branches: [main, 'work/**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate signing configuration and versions
        shell: pwsh
        env:
          ACTION_RELAY_KEYSTORE_BASE64: ${{ secrets.ACTION_RELAY_KEYSTORE_BASE64 }}
          ACTION_RELAY_STORE_PASSWORD: ${{ secrets.ACTION_RELAY_STORE_PASSWORD }}
          ACTION_RELAY_KEY_PASSWORD: ${{ secrets.ACTION_RELAY_KEY_PASSWORD }}
        run: |
          if (-not $env:ACTION_RELAY_KEYSTORE_BASE64 -or -not $env:ACTION_RELAY_STORE_PASSWORD -or -not $env:ACTION_RELAY_KEY_PASSWORD) { throw 'All ACTION_RELAY signing secrets are required.' }
          [xml]$android = Get-Content -Raw android/AndroidManifest.xml
          $watch = Get-Content -Raw watch/src/manifest.json | ConvertFrom-Json
          $ns = 'http://schemas.android.com/apk/res/android'
          if ($android.manifest.GetAttribute('versionName',$ns) -ne $watch.versionName -or [int]$android.manifest.GetAttribute('versionCode',$ns) -ne [int]$watch.versionCode) { throw 'Android and Watch versions differ.' }
          "VERSION_NAME=$($watch.versionName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: '.java-version'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            watch/package-lock.json
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - name: Install verification dependencies
        run: npm ci --ignore-scripts
      - name: Install watch dependencies
        working-directory: watch
        run: npm ci
      - name: Restore fixed signing keystore
        shell: pwsh
        env:
          ACTION_RELAY_KEYSTORE_BASE64: ${{ secrets.ACTION_RELAY_KEYSTORE_BASE64 }}
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP 'action-relay\release.p12'
          New-Item -ItemType Directory -Force -Path (Split-Path $keystore) | Out-Null
          [IO.File]::WriteAllBytes($keystore,[Convert]::FromBase64String($env:ACTION_RELAY_KEYSTORE_BASE64))
          "ACTION_RELAY_KEYSTORE=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build APK and RPK
        shell: pwsh
        env:
          ACTION_RELAY_STORE_PASSWORD: ${{ secrets.ACTION_RELAY_STORE_PASSWORD }}
          ACTION_RELAY_KEY_PASSWORD: ${{ secrets.ACTION_RELAY_KEY_PASSWORD }}
        run: |
          $jdk = Join-Path $env:JAVA_HOME 'bin'
          $platform = Join-Path $env:ANDROID_SDK_ROOT 'platforms\android-37.2'
          $tools = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\37.0.0'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'watch\node_modules\aiot-toolkit\lib\bin.js'
          .\build.ps1 -AndroidPlatform $platform -BuildTools $tools -JdkBin $jdk -AiotCli $cli -VersionName $env:VERSION_NAME -SigningKeystore $env:ACTION_RELAY_KEYSTORE
      - name: Verify APK signature
        shell: pwsh
        run: |
          $apksigner = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\37.0.0\apksigner.bat'
          $details = & $apksigner verify --verbose --print-certs "android\build\ActionRelay-$env:VERSION_NAME.apk"
          if ($LASTEXITCODE -ne 0) { throw 'APK cryptographic signature verification failed.' }
          $details | Write-Output
          $actual = [regex]::Match(($details -join "`n"),'Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)').Groups[1].Value
          $expected = (Get-Content -Raw signing/release-signing.json | ConvertFrom-Json).certificateSha256
          if ($actual.ToUpperInvariant() -ne $expected) { throw 'APK signer differs from the fixed certificate.' }
      - name: Run complete regression suite
        shell: pwsh
        run: ./scripts/test.ps1 -Area all
      - name: Verify package pair
        env:
          ACTION_RELAY_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: node verify-pair.mjs
      - name: Clean signing material
        if: always()
        shell: pwsh
        run: |
          function Remove-SigningFile([string]$root,[string]$relative) {
            $base = [IO.Path]::GetFullPath($root).TrimEnd('\','/') + [IO.Path]::DirectorySeparatorChar
            $target = [IO.Path]::GetFullPath((Join-Path $root $relative))
            if (-not $target.StartsWith($base,[StringComparison]::OrdinalIgnoreCase)) { throw 'Cleanup target escaped its allowed root.' }
            if (Test-Path -LiteralPath $target -PathType Leaf) { Remove-Item -LiteralPath $target -Force }
          }
          Remove-SigningFile $env:RUNNER_TEMP 'action-relay/release.p12'
          Remove-SigningFile $env:GITHUB_WORKSPACE 'watch/sign/debug/private.pem'
          Remove-SigningFile $env:GITHUB_WORKSPACE '.temp_watch/sign/debug/private.pem'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: action-relay-${{ env.VERSION_NAME }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            android/build/ActionRelay-${{ env.VERSION_NAME }}.apk
            watch/dist/cn.local.actionrelay.debug.${{ env.VERSION_NAME }}.rpk
            artifacts/signing-report.json
