name: Build packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION_NAME: '0.3.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: watch/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install watch dependencies
        working-directory: watch
        run: npm ci
      - name: Build APK and RPK
        shell: pwsh
        env:
          ACTION_RELAY_STORE_PASSWORD: ${{ secrets.ACTION_RELAY_STORE_PASSWORD }}
          ACTION_RELAY_KEY_PASSWORD: ${{ secrets.ACTION_RELAY_KEY_PASSWORD }}
        run: |
          $jdk = Join-Path $env:JAVA_HOME 'bin'
          $platform = Join-Path $env:ANDROID_SDK_ROOT 'platforms\android-36'
          $tools = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\36.0.0'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'watch\node_modules\aiot-toolkit\lib\bin.js'
          .\build.ps1 -AndroidPlatform $platform -BuildTools $tools -JdkBin $jdk -AiotCli $cli -VersionName $env:VERSION_NAME
      - name: Install verifier
        run: npm install --no-save --ignore-scripts jszip
      - name: Run compiled watch test
        run: node watch/tests/compiled.test.mjs
      - name: Verify package pair
        env:
          ACTION_RELAY_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: node verify-pair.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: action-relay-${{ env.VERSION_NAME }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            android/build/ActionRelay-${{ env.VERSION_NAME }}.apk
            watch/dist/*.rpk
