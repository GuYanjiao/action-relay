name: nRF52840 combined relay

on:
  workflow_dispatch:
  push:
    branches: [main, 'work/**']
    paths:
      - 'firmware/nrf52840/combined/**'
      - 'firmware/nrf52840/protocol/**'
      - 'firmware/nrf52840/probe/check_uf2.py'
      - '.github/workflows/nrf52840-combined.yml'

permissions:
  contents: read

concurrency:
  group: nrf52840-combined-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordination-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check shared scanning and connection ownership decisions
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/nrf52840/combined/tests/fakes firmware/nrf52840/combined/tests/radio_scan_test.c -o "$RUNNER_TEMP/radio-scan-test"
          "$RUNNER_TEMP/radio-scan-test"
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/nrf52840/combined/tests/fakes firmware/nrf52840/combined/tests/watch_diag_test.c firmware/nrf52840/combined/src/s4_link.c -o "$RUNNER_TEMP/watch-diag-test"
          "$RUNNER_TEMP/watch-diag-test"
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/nrf52840/combined/tests/fakes firmware/nrf52840/combined/src/s4_link.c firmware/nrf52840/combined/tests/s4_link_test.c -o "$RUNNER_TEMP/s4-link-test"
          "$RUNNER_TEMP/s4-link-test"
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/nrf52840/combined/tests/fakes firmware/nrf52840/combined/tests/camera_diag_test.c -o "$RUNNER_TEMP/camera-diag-test"
          "$RUNNER_TEMP/camera-diag-test"
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Ifirmware/nrf52840/combined/tests/fakes firmware/nrf52840/combined/tests/miwear_gatt_test.c -o "$RUNNER_TEMP/miwear-gatt-test"
          "$RUNNER_TEMP/miwear-gatt-test"
      - name: Check MiWear framing across split and merged notifications
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer firmware/nrf52840/protocol/miwear_l1.c firmware/nrf52840/protocol/tests/l1_test.c -o "$RUNNER_TEMP/miwear-l1-test"
          "$RUNNER_TEMP/miwear-l1-test"
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer firmware/nrf52840/protocol/miwear_l1.c firmware/nrf52840/protocol/miwear_sar.c firmware/nrf52840/protocol/tests/sar_test.c -o "$RUNNER_TEMP/miwear-sar-test"
          "$RUNNER_TEMP/miwear-sar-test"
      - name: Check PSA HMAC and CCM against independent implementations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmbedtls-dev protobuf-compiler python3-protobuf
          python firmware/nrf52840/protocol/tests/vectors.py
          gcc -std=c11 -Wall -Wextra -Werror firmware/nrf52840/protocol/miwear_auth.c firmware/nrf52840/protocol/miwear_psa.c firmware/nrf52840/protocol/tests/psa_test.c -lmbedcrypto -lcrypto -o "$RUNNER_TEMP/miwear-psa-test"
          "$RUNNER_TEMP/miwear-psa-test"
      - name: Check bounded authentication Protobuf messages
        run: |
          NB="$RUNNER_TEMP/nanopb"
          GEN="$RUNNER_TEMP/miwear-pb"
          git init "$NB"
          git -C "$NB" remote add origin https://github.com/zephyrproject-rtos/nanopb
          git -C "$NB" fetch --depth 1 origin 7307ce399b81ddcb3c3a5dc862c52d4754328d38
          git -C "$NB" checkout --detach FETCH_HEAD
          mkdir -p "$GEN"
          cd "$GITHUB_WORKSPACE/firmware/nrf52840/combined"
          /usr/bin/python3 "$NB/generator/nanopb_generator.py" -I . -D "$GEN" miwear_auth.proto
          gcc -std=c11 -Wall -Wextra -Werror -I"$NB" -I"$GEN" src/miwear_pb.c tests/miwear_pb_test.c "$GEN/miwear_auth.pb.c" "$NB/pb_common.c" "$NB/pb_encode.c" "$NB/pb_decode.c" -o "$RUNNER_TEMP/miwear-pb-test"
          "$RUNNER_TEMP/miwear-pb-test"
          gcc -std=c11 -Wall -Wextra -Werror -I"$NB" -I"$GEN" src/miwear_pb.c src/miwear_session.c tests/miwear_session_test.c ../protocol/miwear_auth.c ../protocol/miwear_psa.c "$GEN/miwear_auth.pb.c" "$NB/pb_common.c" "$NB/pb_encode.c" "$NB/pb_decode.c" -lmbedcrypto -o "$RUNNER_TEMP/miwear-session-test"
          "$RUNNER_TEMP/miwear-session-test"
          /usr/bin/python3 "$NB/generator/nanopb_generator.py" -I . -D "$GEN" miwear_app.proto
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I"$NB" -I"$GEN" src/miwear_app.c tests/miwear_app_test.c "$GEN/miwear_app.pb.c" "$NB/pb_common.c" "$NB/pb_encode.c" "$NB/pb_decode.c" -o "$RUNNER_TEMP/miwear-app-test"
          "$RUNNER_TEMP/miwear-app-test"
          gcc -std=c11 -Wall -Wextra -Werror -I"$NB" -I"$GEN" src/miwear_pb.c src/miwear_l2.c tests/miwear_l2_test.c ../protocol/miwear_psa.c "$GEN/miwear_auth.pb.c" "$NB/pb_common.c" "$NB/pb_encode.c" "$NB/pb_decode.c" -lmbedcrypto -o "$RUNNER_TEMP/miwear-l2-test"
          "$RUNNER_TEMP/miwear-l2-test"
  combined:
    needs: coordination-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      # Official v3.2.4 image, registry digest verified before adding this workflow.
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:397bac78a3e3825ce30443d4cd28c377ea6e5a28910200820967b648d95f88bb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare compatible Nordic and ANT sources
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends protobuf-compiler
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.2.4 "$RUNNER_TEMP/ncs"
          cd "$RUNNER_TEMP/ncs"
          west update --narrow -o=--depth=1
          python -m pip install -r zephyr/scripts/requirements.txt -r nrf/scripts/requirements.txt
          west zephyr-export
          git clone --branch v2.1.1 --depth 1 https://github.com/ant-nrfconnect/sdk-ant "$RUNNER_TEMP/ant"
      - name: Build combined baseline with retained ANT functionality
        run: |
          cd "$RUNNER_TEMP/ncs"
          west build -b promicro_nrf52840/nrf52840/uf2 "$GITHUB_WORKSPACE/firmware/nrf52840/combined" -d "$RUNNER_TEMP/combined-build" -- \
            "-DZEPHYR_EXTRA_MODULES=$RUNNER_TEMP/ant" \
            "-DPM_STATIC_YML_FILE=$GITHUB_WORKSPACE/firmware/nrf52840/combined/boards/pm_static.yml"
      - name: Check and package baseline firmware
        run: |
          OUTPUT="$RUNNER_TEMP/combined-artifact"
          mkdir -p "$OUTPUT"
          mapfile -t images < <(find "$RUNNER_TEMP/combined-build" -name zephyr.uf2)
          test "${#images[@]}" -eq 1
          cp "${images[0]}" "$OUTPUT/ActionRelay-Combined-Baseline.uf2"
          python "$GITHUB_WORKSPACE/firmware/nrf52840/probe/check_uf2.py" "$OUTPUT/ActionRelay-Combined-Baseline.uf2" --report "$OUTPUT/partition-check.json"
          cp "$GITHUB_WORKSPACE/firmware/nrf52840/combined/README.md" "$OUTPUT/README.md"
          cp "$GITHUB_WORKSPACE/firmware/nrf52840/combined/upstream.json" "$OUTPUT/upstream.json"
          cp -r "$GITHUB_WORKSPACE/firmware/nrf52840/combined/LICENSES" "$OUTPUT/LICENSES"
          cd "$OUTPUT"
          sha256sum *.uf2 > SHA256SUMS.txt
          python - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          revision=lambda p: subprocess.check_output(['git','rev-parse','HEAD'],cwd=p,text=True).strip()
          meta={'phase':'combined-readonly-diagnostics','commit':os.environ['GITHUB_SHA'],
                'board':'promicro_nrf52840/nrf52840/uf2','ncs':'3.2.4','ant':'2.1.1',
                'ncsCommit':revision(root/'ncs/nrf'),'antCommit':revision(root/'ant'),
                'nanopbCommit':revision(root/'ncs/modules/lib/nanopb'),
                'hardwareTested':False,'cameraControlImplemented':False,
                'authenticationImplemented':False,'heartRateBaselineRetained':True,
                'watchDiagnosticsImplemented':True}
          pathlib.Path('build-info.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nrf52840-combined-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/combined-artifact/
          if-no-files-found: error
          retention-days: 30
