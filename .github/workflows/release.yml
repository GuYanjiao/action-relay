name: Automatic release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'rust-core/**'
      - 'rust-toolchain.toml'
      - 'scripts/build-rust.sh'
      - '.github/workflows/rust-core.yml'
      - 'watch/**'
      - 'tests/**'
      - 'signing/**'
      - 'scripts/release*'
      - 'scripts/publish-release.mjs'
      - 'scripts/stamp-version.mjs'
      - 'scripts/sign-release-tag.sh'
      - 'scripts/test.ps1'
      - 'scripts/assert-apk-signer.ps1'
      - 'release-policy.json'
      - 'build.ps1'
      - 'verify-pair.mjs'
      - 'ExportSigning.java'
      - 'package*.json'
      - '.node-version'
      - '.java-version'
      - '.github/workflows/release.yml'
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: automatic-release-main
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Check release version rules
        run: node --test scripts/release.test.mjs
      - id: version
        run: node scripts/release-plan.mjs
  packages:
    needs: plan
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      version_code: ${{ fromJSON(needs.plan.outputs.version_code) }}
      artifact_name: release-phone
    secrets: inherit
  publish:
    needs: [plan, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-phone
          path: release-input
      - name: Verify and prepare release assets
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: node scripts/release-assets.mjs phone "$RELEASE_VERSION"
      - name: Sign and push version tag
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          ACTION_RELAY_GPG_PRIVATE_KEY: ${{ secrets.ACTION_RELAY_GPG_PRIVATE_KEY }}
          ACTION_RELAY_GPG_PASSPHRASE: ${{ secrets.ACTION_RELAY_GPG_PASSPHRASE }}
        run: bash scripts/sign-release-tag.sh "v$RELEASE_VERSION"
      - name: Publish complete release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/publish-release.mjs phone "$RELEASE_VERSION"
