# Red Pro Micro clones may omit the 32.768 kHz crystal. Use the HF crystal
# synthesized LF clock for initial bring-up (higher power consumption).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_50PPM=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Action Relay Combined"
CONFIG_REBOOT=y
